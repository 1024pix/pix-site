name: Build & Deploy Pix Site and Pix pro to Scaleway
on:
  workflow_dispatch:
  push:
    # Pattern matched against refs/tags
    tags:
      - '*' # Push events to every tag not containing / ( prevents tags like v1.2.3/beta )

jobs:
  get-last-tag:
    runs-on: ubuntu-latest
    outputs:
      last_tag: ${{ steps.compute-date-tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v4
    - name: Get latest release
      id: last-release
      uses: actions-ecosystem/action-get-latest-tag@v1
      with:
        semver_only: true
    - name: Compute tag based on the date
      id: compute-date-tag
      run: echo "tag=${{ steps.last-release.outputs.tag }}.$(date +'%Y.%m.%d').$(printf '%03d' ${{ github.run_number }})" >> $GITHUB_OUTPUT

  build-and-push-image:
    strategy:
      matrix:
        include:
          - site: pix-site
            domain-url-fr: ${{ vars.PIX_SITE_DOMAIN_FR }}
            domain-url-org: ${{ vars.PIX_SITE_DOMAIN_ORG }}
          - site: pix-pro
            domain-url-fr: ${{ vars.PIX_PRO_DOMAIN_FR }}
            domain-url-org: ${{ vars.PIX_PRO_DOMAIN_ORG }}
    needs: get-last-tag
    uses: 1024pix/pix-actions/.github/workflows/docker-bake.yml@main
    with:
      files: |
        docker-bake.hcl
      targets: |
        ${{ matrix.site }}
      set: |
        pix-site.cache-from=type=gha,scope=pix-site
        pix-pro.cache-from=type=gha,scope=pix-pro
        pix-site.cache-to=type=gha,scope=pix-site,mode=max
        pix-pro.cache-to=type=gha,scope=pix-pro,mode=max
      vars: |
        SITE=${{ matrix.site }}
        DOMAIN_FR=${{ matrix.domain-url-fr }}
        DOMAIN_ORG=${{ matrix.domain-url-org }}
        EASIWARE_SCRIPT_URL=${{ vars.EASIWARE_SCRIPT_URL }}
        TAG=${{ needs.get-last-tag.outputs.last_tag }}
    secrets:
      REGISTRY_ENDPOINT: ${{ secrets.CONTAINER_REGISTRY_PRODUCTION_ENDPOINT }}
      REGISTRY_TOKEN: ${{ secrets.SCW_CONTAINER_REGISTRY_INFRA_SECRET_KEY }}
      REGISTRY_USERNAME: nologin
