name: Build & Deploy Pix Site and Pix pro to Scaleway
on:
  workflow_dispatch:
  push:
    # Pattern matched against refs/tags
    tags:
      - '*' # Push events to every tag not containing / ( prevents tags like v1.2.3/beta )

jobs:
  get-last-tag:
    runs-on: ubuntu-latest
    outputs:
      last_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Get latest release
      id: last-release
      if: startsWith(github.ref, 'refs/tags/') == false
      uses: actions-ecosystem/action-get-latest-tag@v1
      with:
        semver_only: true
    - name: Set tag
      id: set-tag
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
          echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          TODAY_API=$(date +'%Y-%m-%d')
          DAILY_RUN_COUNT=$(gh run list --workflow "${{ github.workflow }}" --created "$TODAY_API" -L 1000 --json databaseId -q 'length')

          if [ -z "$DAILY_RUN_COUNT" ]; then
            DAILY_RUN_COUNT=0
          fi

          DAILY_RUN_COUNT=$(( DAILY_RUN_COUNT + 1 ))

          FORMATTED_COUNT=$(printf '%03d' $DAILY_RUN_COUNT)

          TODAY_TAG=$(date +'%Y.%m.%d')
          FINAL_TAG="${{ steps.last-release.outputs.tag }}.$TODAY_TAG.$FORMATTED_COUNT"
          echo "tag=$FINAL_TAG" >> $GITHUB_OUTPUT
        fi
  build-and-push-image:
    strategy:
      matrix:
        include:
          - site: pix-site
            domain-url-fr: ${{ vars.PIX_SITE_DOMAIN_FR }}
            domain-url-org: ${{ vars.PIX_SITE_DOMAIN_ORG }}
          - site: pix-pro
            domain-url-fr: ${{ vars.PIX_PRO_DOMAIN_FR }}
            domain-url-org: ${{ vars.PIX_PRO_DOMAIN_ORG }}
    needs: get-last-tag
    uses: 1024pix/pix-actions/.github/workflows/docker-bake.yml@main
    with:
      files: |
        docker-bake.hcl
      targets: |
        ${{ matrix.site }}
      set: |
        pix-site.cache-from=type=gha,scope=pix-site
        pix-pro.cache-from=type=gha,scope=pix-pro
        pix-site.cache-to=type=gha,scope=pix-site,mode=max
        pix-pro.cache-to=type=gha,scope=pix-pro,mode=max
      vars: |
        SITE=${{ matrix.site }}
        DOMAIN_FR=${{ matrix.domain-url-fr }}
        DOMAIN_ORG=${{ matrix.domain-url-org }}
        EASIWARE_SCRIPT_URL=${{ vars.EASIWARE_SCRIPT_URL }}
        TAG=${{ needs.get-last-tag.outputs.last_tag }}
    secrets:
      REGISTRY_ENDPOINT: ${{ secrets.CONTAINER_REGISTRY_PRODUCTION_ENDPOINT }}
      REGISTRY_TOKEN: ${{ secrets.SCW_CONTAINER_REGISTRY_INFRA_SECRET_KEY }}
      REGISTRY_USERNAME: nologin
