services:
  nginx:
    image: nginx:latest@sha256:b34848eff6db786b6b1282d3a9c3fd0b5563dfb6d261df4923378b419e0d24f0
    container_name: production_nginx
    tmpfs:
      - /etc/nginx/logs
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./build:/app/build
      - ./nginx/includes/rewrites.conf:/app/nginx/includes/rewrites.conf
    ports:
      - 80:80
